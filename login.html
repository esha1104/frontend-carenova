<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - CareNova</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body, html { font-family:'Arial',sans-serif; background-color:#FAFAFF; color:#30343F; height:100%; }

    header {
      display:flex; justify-content:space-between; align-items:center;
      padding:20px 40px; background-color:#1E2749; color:#FAFAFF;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    .logo { font-size:28px; font-weight:bold; color:#E4D9FF; text-decoration:none; }
    header nav ul { list-style:none; display:flex; gap:30px; }
    header nav a { text-decoration:none; color:#FAFAFF; font-weight:500; transition:color 0.3s; }
    header nav a:hover { color:#E4D9FF; }

    .main-container {
      display:flex; justify-content:center; align-items:center;
      min-height:calc(100vh - 80px); padding:40px 20px;
      background:linear-gradient(135deg,#f5f7ff 0%,#f9f9fc 100%);
    }
    .login-card {
      background:white; border-radius:15px; box-shadow:0 10px 40px rgba(0,0,0,0.1);
      padding:50px 40px; max-width:450px; width:100%;
      animation:slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .login-card h2 { font-size:28px; color:#1E2749; margin-bottom:10px; text-align:center; }
    .login-card-subtitle { text-align:center; color:#666; font-size:14px; margin-bottom:30px; line-height:1.5; }

    .form-group { margin-bottom:20px; }
    .form-group label { display:block; margin-bottom:8px; color:#1E2749; font-weight:600; font-size:14px; }
    .form-group input {
      width:100%; padding:12px 15px; border:1px solid #E4D9FF; border-radius:8px;
      font-size:14px; font-family:inherit; transition:all 0.3s;
    }
    .form-group input:focus { outline:none; border-color:#1E2749; box-shadow:0 0 0 3px rgba(30,39,73,0.1); }
    .form-group input::placeholder { color:#999; }

    .login-btn {
      width:100%; padding:14px; margin-top:10px; border:none; border-radius:8px;
      font-size:16px; font-weight:600; cursor:pointer; background-color:#1E2749;
      color:white; transition:all 0.3s;
    }
    .login-btn:hover { background-color:#273469; transform:translateY(-2px); box-shadow:0 5px 15px rgba(30,39,73,0.3); }
    .login-btn:disabled { background-color:#ccc; cursor:not-allowed; transform:none; }

    /* ✅ Demo mode button */
    .demo-btn {
      width:100%; padding:12px; margin-top:10px; border:2px dashed #4f8ef7;
      border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
      background-color:transparent; color:#4f8ef7; transition:all 0.3s;
    }
    .demo-btn:hover { background-color:#e8f0fe; }

    .message { padding:12px; border-radius:8px; margin-bottom:20px; font-size:14px; text-align:center; display:none; }
    .message.success { background-color:#d4edda; color:#155724; border:1px solid #c3e6cb; display:block; }
    .message.error   { background-color:#f8d7da; color:#721c24; border:1px solid #f5c6cb; display:block; }
    .message.info    { background-color:#d1ecf1; color:#0c5460; border:1px solid #bee5eb; display:block; }

    .form-section { display:none; }
    .form-section.active { display:block; }

    .back-home { text-align:center; margin-top:20px; }
    .back-home a { color:#1E2749; text-decoration:none; font-weight:600; }
    .back-home a:hover { color:#273469; }

    .loading {
      display:inline-block; width:16px; height:16px;
      border:2px solid #f3f3f3; border-top:2px solid #1E2749;
      border-radius:50%; animation:spin 1s linear infinite;
      margin-right:8px; vertical-align:middle;
    }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

    .divider {
      text-align:center; margin:15px 0; color:#999; font-size:12px;
      display:flex; align-items:center; gap:10px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background:#E4D9FF;
    }

    @media(max-width:600px){
      header{flex-direction:column;padding:15px;gap:15px;text-align:center;}
      header nav ul{flex-direction:column;gap:10px;}
      .login-card{padding:30px 20px;}
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">CareNova</a>
    <nav>
      <ul>
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#about">About</a></li>
      </ul>
    </nav>
  </header>

  <div class="main-container">
    <div class="login-card">
      <h2>Secure Login</h2>
      <p class="login-card-subtitle">Access your personalized health assistant with a secure passwordless login</p>

      <div id="message" class="message"></div>

      <div class="form-section active" id="email-section">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <!-- Normal login button -->
        <button class="login-btn" onclick="sendEmailLink()" id="sendBtn">
          Send Secure Login Link
        </button>

        <p style="text-align:center;margin-top:15px;color:#666;font-size:12px;">
          We'll send you a secure link to your email. No password required.
        </p>

        <!-- ✅ Divider -->
        <div class="divider">or for testing</div>

        <!-- ✅ Demo mode button — bypasses Firebase quota -->
        <button class="demo-btn" onclick="demoLogin()">
          🧪 Demo Login (Testing Only)
        </button>
      </div>

      <div class="back-home">
        <a href="index.html">← Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    // ── Firebase init ─────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyBVNU3qsMJs6diyrmG9kax6Dz391JSKQDg",
      authDomain: "otpp-9bb28.firebaseapp.com",
      projectId: "otpp-9bb28",
      storageBucket: "otpp-9bb28.appspot.com",
      messagingSenderId: "714490495421",
      appId: "1:714490495421:web:60b8b690d08a51812712d4"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ── Show message ──────────────────────────────────────
    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
      el.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }

    // ✅ DEMO LOGIN — bypasses Firebase, sets a fake token for testing
    function demoLogin() {
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();

      if (!email) {
        showMessage('Please enter your email address first.', 'error');
        emailInput.focus();
        return;
      }

      showMessage('✓ Demo login successful! Opening CareNova chatbot...', 'success');

      // Set a demo token so chatbot.js auth check passes
      localStorage.setItem('carenova_auth_token', 'demo_token_' + Date.now());

      setTimeout(function() {
        window.open('chatbot.html', '_blank');
      }, 1000);
    }

    // ── STEP 1: Send magic link ───────────────────────────
    function sendEmailLink() {
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();
      const sendBtn = document.getElementById('sendBtn');
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email || !emailRegex.test(email)) {
        showMessage('Please enter a valid email address.', 'error');
        emailInput.focus();
        return;
      }

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<span class="loading"></span>Sending...';

      auth.sendSignInLinkToEmail(email, {
        url: window.location.href,
        handleCodeInApp: true
      })
      .then(function() {
        localStorage.setItem('emailForSignIn', email);
        showMessage('✓ Login link sent to ' + email + '! Check your inbox.', 'success');
        emailInput.value = '';
        sendBtn.disabled = false;
        sendBtn.innerHTML = 'Send Secure Login Link';
      })
      .catch(function(error) {
        // ✅ If quota exceeded, show helpful message and highlight demo button
        if (error.code === 'auth/quota-exceeded' || error.message.includes('quota')) {
          showMessage('Firebase quota exceeded. Please use Demo Login below for testing.', 'error');
        } else {
          showMessage('Error: ' + error.message, 'error');
        }
        sendBtn.disabled = false;
        sendBtn.innerHTML = 'Send Secure Login Link';
      });
    }

    // ── STEP 2: Complete sign-in + verify with FastAPI ────
    function completeSignIn(emailAddress) {
      if (!emailAddress) return;
      showMessage('Verifying your login...', 'info');

      auth.signInWithEmailLink(emailAddress, window.location.href)
        .then(function(result) {
          localStorage.removeItem('emailForSignIn');
          return result.user.getIdToken();
        })
        .then(function(idToken) {
          return fetch('http://127.0.0.1:8000/api/auth/verify-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_token: idToken })
          })
          .then(function(response) {
            return response.json().then(function(data) {
              return { ok: response.ok, data: data, idToken: idToken };
            });
          });
        })
        .then(function(result) {
          if (result.ok && result.data.success) {
            localStorage.setItem('carenova_auth_token', result.idToken);
            showMessage('✓ Login successful! Opening CareNova chatbot...', 'success');
            window.history.replaceState({}, document.title, window.location.pathname);
            setTimeout(function() {
              window.open('chatbot.html', '_blank');
            }, 1000);
          } else {
            showMessage('Server verification failed. Please try again.', 'error');
          }
        })
        .catch(function(error) {
          showMessage('Sign in error: ' + error.message, 'error');
        });
    }

    // ── Show email confirmation UI ────────────────────────
    function showEmailConfirmation() {
      const emailSection = document.getElementById('email-section');
      const confirmHTML = '<div style="background:#d1ecf1;border:1px solid #bee5eb;border-radius:8px;padding:15px;margin-bottom:20px;">' +
        '<p style="margin:0 0 10px 0;color:#0c5460;font-size:14px;"><strong>Please confirm your email</strong> to complete sign-in.</p>' +
        '<input type="email" id="confirmEmail" placeholder="Enter your email address"' +
        ' style="width:100%;padding:12px 15px;border:1px solid #bee5eb;border-radius:8px;font-size:14px;margin-bottom:10px;" />' +
        '<button onclick="handleEmailConfirmation()"' +
        ' style="width:100%;padding:12px;background:#1E2749;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">' +
        'Confirm & Complete Sign In</button></div>';
      emailSection.innerHTML = confirmHTML + emailSection.innerHTML;
    }

    function handleEmailConfirmation() {
      const confirmEmail = document.getElementById('confirmEmail');
      if (!confirmEmail) return;
      const email = confirmEmail.value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage('Please enter a valid email address.', 'error');
        return;
      }
      completeSignIn(email);
    }

    // ── Auto-detect magic link on page load ──────────────
    if (auth.isSignInWithEmailLink(window.location.href)) {
      const email = localStorage.getItem('emailForSignIn');
      if (email) {
        completeSignIn(email);
      } else {
        showEmailConfirmation();
      }
    }

    // Enter key support
    document.getElementById('email').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendEmailLink();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CareNova — Health Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #f0f9f8 0%, #e8f4f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chatbot-wrapper {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(14,124,123,0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 88vh;
      min-height: 520px;
    }

    /* ── Header ── */
    .chatbot-header {
      background: linear-gradient(135deg, #0e7c7b, #0a5f5e);
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .header-avatar {
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .header-info h3 { color:#fff; font-family:'Playfair Display',serif; font-size:1.15rem; margin:0; }
    .header-info p  { color:rgba(255,255,255,0.75); font-size:0.78rem; margin:2px 0 0; }
    .status-dot {
      width:8px; height:8px; background:#4ade80; border-radius:50%;
      display:inline-block; margin-right:5px; animation:pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .header-back {
      margin-left:auto; color:rgba(255,255,255,0.85); text-decoration:none;
      font-size:0.82rem; background:rgba(255,255,255,0.15); padding:6px 14px;
      border-radius:20px; transition:background 0.2s; white-space:nowrap;
    }
    .header-back:hover { background:rgba(255,255,255,0.25); }

    /* ── Chat messages ── */
    #chatBox {
      flex:1; overflow-y:auto; padding:1.5rem;
      display:flex; flex-direction:column; gap:14px; background:#fafefe;
    }
    #chatBox::-webkit-scrollbar { width:5px; }
    #chatBox::-webkit-scrollbar-thumb { background:#c8e6e6; border-radius:10px; }

    /* ── Messages ── */
    .msg { display:flex; gap:10px; animation:msgIn 0.3s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    .msg.user { flex-direction:row-reverse; }

    .msg-avatar {
      width:34px; height:34px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:0.82rem; font-weight:600;
    }
    .msg.bot  .msg-avatar { background:#d1f0ef; color:#0e7c7b; font-size:1rem; }
    .msg.user .msg-avatar { background:#003d66; color:#fff; }

    .msg-bubble {
      max-width:72%; padding:0.75rem 1rem; border-radius:16px;
      font-size:0.9rem; line-height:1.55;
    }
    .msg.bot .msg-bubble {
      background:#fff; border:1px solid #e0f2f1; color:#1a1a2e;
      border-top-left-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.05);
    }
    .msg.user .msg-bubble {
      background:linear-gradient(135deg,#0e7c7b,#0a5f5e);
      color:#fff; border-top-right-radius:4px;
    }

    /* ── Typing indicator ── */
    .typing-indicator { display:flex; gap:5px; align-items:center; padding:6px 2px; }
    .typing-indicator span {
      width:7px; height:7px; background:#0e7c7b; border-radius:50%;
      animation:bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay:0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:0.4;} 40%{transform:translateY(-6px);opacity:1;} }

    /* ── Follow-up questions card ── */
    .followup-card {
      background:#fff; border:1px solid #e0f2f1; border-radius:16px;
      padding:1.2rem; max-width:85%;
      box-shadow:0 2px 12px rgba(14,124,123,0.08);
    }
    .followup-intro {
      font-weight:600; color:#1a1a2e; margin-bottom:14px; font-size:0.9rem;
    }
    .followup-questions { display:flex; flex-direction:column; gap:12px; }
    .followup-q {
      background:#f0fafa; border:1px solid #b2dfde;
      border-radius:12px; padding:0.75rem 1rem;
    }
    .followup-q strong { font-size:0.88rem; color:#1a1a2e; display:block; margin-bottom:6px; }
    .followup-q input[type="text"] {
      width:100%; border:none; background:transparent; outline:none;
      font-size:0.85rem; color:#1a1a2e; font-family:'DM Sans',sans-serif;
      border-bottom:1px solid #b2dfde; padding-bottom:3px;
    }
    .followup-q input::placeholder { color:#aaa; }
    .followup-submit {
      background:#0e7c7b; color:white; border:none;
      padding:0.6rem 1.3rem; border-radius:10px; cursor:pointer;
      font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:600;
      margin-top:14px; transition:background 0.2s;
    }
    .followup-submit:hover { background:#0a5f5e; }

    /* ── Analysis card ── */
    .analysis-card {
      background:#fff; border:1px solid #e0f2f1; border-radius:16px;
      padding:1.2rem; font-size:0.875rem; color:#1a1a2e;
      box-shadow:0 2px 12px rgba(14,124,123,0.08); max-width:85%;
    }
    .analysis-card h4 { font-family:'Playfair Display',serif; color:#0e7c7b; margin:0 0 10px; font-size:1rem; }
    .severity-badge {
      display:inline-block; padding:3px 10px; border-radius:20px;
      font-size:0.78rem; font-weight:600; margin-bottom:10px;
    }
    .severity-low      { background:#d1fae5; color:#065f46; }
    .severity-moderate { background:#fef3c7; color:#92400e; }
    .severity-high     { background:#fee2e2; color:#991b1b; }
    .severity-default  { background:#e0f2f1; color:#0e7c7b; }
    .section-title     { font-weight:600; color:#0e7c7b; margin:10px 0 4px; }
    .section-title.red { color:#c0392b; }
    .analysis-card ul  { margin:0 0 6px 18px; padding:0; }
    .analysis-card li  { margin-bottom:3px; }
    .disclaimer {
      font-size:0.75rem; color:#888; border-top:1px solid #e0f2f1;
      padding-top:8px; margin-top:10px; font-style:italic;
    }

    /* ── Input bar ── */
    .chat-input-area {
      padding:1rem 1.2rem; border-top:1px solid #e8f5f5;
      background:#fff; display:flex; gap:10px; align-items:flex-end; flex-shrink:0;
    }
    #messageInput {
      flex:1; border:1.5px solid #b2dfde; border-radius:14px;
      padding:0.7rem 1rem; font-family:'DM Sans',sans-serif; font-size:0.9rem;
      outline:none; resize:none; max-height:100px; transition:border-color 0.2s;
      color:#1a1a2e; background:#fafefe;
    }
    #messageInput:focus { border-color:#0e7c7b; background:#fff; }
    #messageInput::placeholder { color:#aaa; }

    #sendBtn {
      background:linear-gradient(135deg,#0e7c7b,#0a5f5e); color:white;
      border:none; padding:0.75rem 1.1rem; border-radius:14px;
      cursor:pointer; font-size:1.1rem; transition:opacity 0.2s,transform 0.15s; flex-shrink:0;
    }
    #sendBtn:hover   { opacity:0.9; transform:scale(1.04); }
    #sendBtn:active  { transform:scale(0.97); }
    #sendBtn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

    .chat-hint {
      font-size:0.75rem; color:#aaa; text-align:center;
      padding:0 1.2rem 0.6rem; flex-shrink:0;
    }

    @media(max-width:600px) {
      body { padding:0; align-items:flex-start; }
      .chatbot-wrapper { border-radius:0; height:100vh; }
    }
  </style>
</head>
<body>
  <div class="chatbot-wrapper">

    <div class="chatbot-header">
      <div class="header-avatar">🩺</div>
      <div class="header-info">
        <h3>CareNova Health Assistant</h3>
        <p><span class="status-dot"></span>Online · AI + RAG Powered</p>
      </div>
      <a href="index.html" class="header-back">← Back to Home</a>
    </div>

    <div id="chatBox"></div>

    <div class="chat-input-area">
      <textarea id="messageInput" rows="1"
        placeholder="Describe your symptoms (e.g. I have a headache and fever)…"></textarea>
      <button id="sendBtn">➤</button>
    </div>
    <p class="chat-hint">⚠️ For informational purposes only. Always consult a qualified healthcare provider.</p>

  </div>

  <script src="js/chatbot.js"></script>
</body>
</html>
